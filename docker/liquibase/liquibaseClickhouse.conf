# Cluster mode for Liquibase's OWN tables (DATABASECHANGELOG, DATABASECHANGELOGLOCK_V1).
# All three keys are required; if one is missing the extension silently falls back to
# single-node mode. Check the log for: "Work in cluster replicated clickhouse mode".
#
# Keeper path = tableZooKeeperPathPrefix + <database> + "/" + <table>
# so the prefix must NOT contain {database} (the upstream README example does).
#
# Any key can be overridden at runtime with JAVA_OPTS, e.g.
#   JAVA_OPTS="-Dcluster.clusterName=my_cluster"
cluster {
    clusterName = "{cluster}"
    tableZooKeeperPathPrefix = "/clickhouse/tables/{shard}/"
    tableReplicaName = "{replica}"
}
