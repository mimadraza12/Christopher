# Master changelog: one folder per ClickHouse database, applied IN THIS ORDER.
#
# List databases explicitly (no includeAll here) so dependencies are deterministic:
# analytics materialized views read raw tables, so raw comes first.
#
# Liquibase's own tables (DATABASECHANGELOG, DATABASECHANGELOGLOCK_V1) live in the
# separate `liquibase` database named in the JDBC URL, not in any of these.
#
# Changeset identity = id + author + path relative to this folder (e.g.
# "analytics/tables/vendors/...sql"). Never move or rename an applied file.
databaseChangeLog:
  - include:
      file: raw/changelog.yaml
      relativeToChangelogFile: true
  - include:
      file: analytics/changelog.yaml
      relativeToChangelogFile: true
  - include:
      file: direct/changelog.yaml
      relativeToChangelogFile: true
